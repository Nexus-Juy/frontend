server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # 127.0.0.11 es el DNS interno de Docker. Con la variable, Nginx resuelve el nombre en cada petición
  # y no falla al arrancar si api-gateway todavía no está levantado.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $gateway http://api-gateway:8066;
    proxy_pass $gateway;   # sin ruta: se reenvía /api/v1/... tal cual
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: cualquier ruta que no sea un archivo devuelve index.html (para recargar en /shipments/123).
  location / {
    try_files $uri /index.html;
  }
}
